packages:
  - "packages/*"
  # app/docs is intentionally NOT a workspace member: it runs TanStack Start
  # SSR, which is proven on real vite@8 but breaks (silent hydration
  # unclaiming) on the vite-plus-core engine this workspace overrides `vite`
  # to. It has its own pnpm-workspace.yaml, lockfile and node_modules — a plain
  # `pnpm install` inside app/docs treats it as its own workspace root.
  - "app/dev"

allowBuilds:
  # canvas' native build is unnecessary — jsdom runs the suite without it.
  canvas: false
  esbuild: true

# Pre/post scripts must run so the library's `pretest` reference gate fires.
enablePrePostScripts: true

# Solid 2.0 release candidates and their tooling publish faster than the default
# minimum release age. Keep this list to the exact versions pinned in the manifests.
minimumReleaseAgeExclude:
  - solid-js@2.0.0-rc.19
  - "@solidjs/web@2.0.0-rc.19"
  - "@solidjs/signals@2.0.0-rc.19"
  - "@solidjs/diagnostics@2.0.0-rc.19"
  - "@solidjs/compiler@2.0.0-rc.19"
  - "@solidjs/babel-plugin@2.0.0-rc.19"
  - "@solidjs/vite-plugin@3.0.0-next.52"
  - "@solidjs/testing-library@1.0.0-rc.2"

# Release-candidate Solid 2.0 + Vite+ toolchain: hoisted layout so plugin peer
# resolution and the `vp` bin behave like the npm-flat setup proven green.
nodeLinker: hoisted

# `vite` is aliased to @voidzero-dev/vite-plus-core (see `overrides` below), whose own
# version (1.x) can never satisfy the `^8` ranges that plugins declare — allow it
# explicitly instead of carrying an unmet-peer warning on every install.
peerDependencyRules:
  allowedVersions:
    vite: "*"

# Remap `vite` to the Vite+ engine (@voidzero-dev/vite-plus-core) for every specifier,
# including plugin peer ranges, and pin `vitest` to the stock release vite-plus bundles
# (vite-plus 1.x ships no separate test engine) so the project and `vp test` share one
# Vitest copy (see node_modules/vite-plus/README.md). Keep both in lockstep with the
# installed `vite-plus` version / `vp toolchain vitest`.
overrides:
  vite@*: "npm:@voidzero-dev/vite-plus-core@1.4.0"
  vitest@*: "5.0.5"
